[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "keystones-lookml"
dynamic = ["version"]
description = "Gate LookML views and explores on what they mean, not on their labels"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kyle James Walker" }]
keywords = ["lookml", "looker", "keystones", "pre-commit", "code-review", "codeowners"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["keystones>=0.3", "lkml>=1.3,<2"]

[project.urls]
Homepage = "https://github.com/KyleJamesWalker/keystones-lookml"
Issues = "https://github.com/KyleJamesWalker/keystones-lookml/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pre-commit>=4",
    "ruff==0.16.8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/keystones_lookml/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/keystones_lookml"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
